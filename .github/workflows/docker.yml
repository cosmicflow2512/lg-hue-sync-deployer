name: docker

on:
  push:
    branches: [main]
  schedule:
    # woechentlich neu bauen, damit Rust stable im Image aktuell bleibt
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lg-hue-sync-deployer:latest
            ghcr.io/${{ github.repository_owner }}/lg-hue-sync-deployer:${{ github.sha }}
